name: Package website source
on:
  push:
    branches:
      - design/general-character-archive
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Create source ZIP
        run: zip -r una-eademque-essentia-site.zip index.html style.css script.js data.js README.md README.txt assets/
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: una-eademque-essentia-site
          path: una-eademque-essentia-site.zip
          if-no-files-found: error
          retention-days: 7
