name: Validate and package site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check HTML parsing and CSS brace balance
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class PageParser(HTMLParser):
              pass

          parser = PageParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          parser.close()

          css = Path("style.css").read_text(encoding="utf-8")
          if css.count("{") != css.count("}"):
              raise SystemExit("CSS brace count is unbalanced")
          print("HTML parse and CSS brace checks passed.")
          PY

      - name: Check homepage illustration
        run: test -s assets/archive-clerk.webp

      - name: Package website files
        run: zip -r una-eademque-essentia-site.zip . -x '.git/*' '.github/*'

      - name: Upload website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: una-eademque-essentia-site
          path: una-eademque-essentia-site.zip
          retention-days: 7
