name: Deploy Multiplayer Worker
# Re-triggered after Cloudflare repository secrets setup.

on:
  push:
    branches:
      - main
    paths:
      - "multiplayer/**"
      - ".github/workflows/deploy-multiplayer-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-multiplayer-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy uee-multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate JavaScript syntax
        run: |
          node --input-type=module --check < multiplayer/src/index.js
          node --check multiplayer.js

      - name: Check Cloudflare deployment credentials
        id: cloudflare_credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare deployment setup still needed"
              echo
              echo "Add these repository Actions secrets, then run this workflow again:"
              echo
              echo "- CLOUDFLARE_API_TOKEN"
              echo "- CLOUDFLARE_ACCOUNT_ID"
              echo
              echo "Do not put the API token in a source file or send it in chat."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Worker
        if: steps.cloudflare_credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: multiplayer
          command: deploy

      - name: Verify Worker health endpoint
        if: steps.cloudflare_credentials.outputs.ready == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://uee-multiplayer.tjeielgevero.workers.dev/api/health; then
              echo
              exit 0
            fi
            echo "Health check attempt ${attempt}/5 failed; retrying..."
            sleep 5
          done
          echo "Worker deployed, but its health endpoint did not return a successful response."
          exit 1

      - name: Run multiplayer end-to-end tests
        if: steps.cloudflare_credentials.outputs.ready == 'true'
        env:
          UEE_WORKER_URL: https://uee-multiplayer.tjeielgevero.workers.dev
        run: node multiplayer/smoke-test.mjs
