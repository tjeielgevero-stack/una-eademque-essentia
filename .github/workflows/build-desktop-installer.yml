name: Build UEE Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "app-icon.svg"
      - "index.html"
      - "style.css"
      - "script.js"
      - "data.js"
      - "multiplayer.js"
      - "lore-book.js"
      - ".github/workflows/build-desktop-installer.yml"

permissions:
  contents: write

concurrency:
  group: uee-desktop-installer
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate application icons
        working-directory: src-tauri
        run: cargo tauri icon ../app-icon.svg

      - name: Prepare frontend bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/vendor, desktop/assets | Out-Null
          Copy-Item style.css desktop/vendor/legacy.css -Force
          Copy-Item multiplayer.js desktop/vendor/multiplayer.js -Force
          Copy-Item lore-book.js desktop/vendor/lore-book.js -Force
          Copy-Item app-icon.svg desktop/assets/app-icon.svg -Force
          if (!(Test-Path desktop/index.html)) { throw "Dedicated desktop entry point is missing." }
          node --check desktop/app.js
          node --check desktop/modules/legacy-ui.js
          node --check desktop/modules/simulator.js
          node --check desktop/vendor/multiplayer.js
          node --check desktop/vendor/lore-book.js
          node desktop/smoke-test.mjs

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: desktop-v__VERSION__
          releaseName: "U.E.E Rebuilt Desktop v__VERSION__"
          releaseBody: |
            U.E.E Rebuilt — dedicated desktop application.

            Major desktop rebuild with a separate desktop entry point, a new Character Creator and Archive, and preserved Settings, Effects, Lore Book, Mirror Arena, Multiplayer, Mirror Observatory, and hidden desktop gate.
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
