[package]
name = "app"
version = "0.8.0"
description = "Una Eademque Essentia desktop archive"
authors = ["Una Eademque Essentia"]
license = ""
repository = "https://github.com/tjeielgevero-stack/una-eademque-essentia"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
